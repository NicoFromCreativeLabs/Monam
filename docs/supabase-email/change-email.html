<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirma tu nuevo correo</title>
  </head>
  <body style="margin:0;padding:0;background:#f1eae5;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Confirma tu nuevo correo.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1eae5;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding:0 0 28px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;letter-spacing:6px;color:#3f0215;">
                MONÂM
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border-radius:18px;padding:36px 32px;font-family:Helvetica,Arial,sans-serif;color:#3f0215;">
                <h1 style="margin:0 0 16px 0;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:normal;color:#3f0215;">Confirma tu nuevo correo</h1>
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#3f0215;">Pediste cambiar el correo de tu cuenta MONÂM a {{ .NewEmail }}. Confírmalo para terminar el cambio.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
                  <tr>
                    <td style="background:#3f0215;border-radius:999px;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/my" style="display:inline-block;padding:14px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;color:#f1eae5;text-decoration:none;">Confirmar el cambio</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:12px;line-height:1.6;color:#3f0215;opacity:0.6;">Si no lo pediste tú, ignora este mensaje y avísanos.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#3f0215;opacity:0.5;">
                MONÂM Skin Studio · Ciudad de México
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
